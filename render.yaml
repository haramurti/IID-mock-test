# Render Blueprint: one Docker web service (Go API + embedded React app).
# Render builds ./Dockerfile on every push to main.
services:
  - type: web
    name: lead-dashboard
    runtime: docker
    plan: free # sleeps when idle; first request after sleep takes ~30-50s
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_SOURCE
        value: mock
      # Real deployments would set EXPA_TOKEN as a secret in the Render
      # dashboard (sync: false = never stored in this file or the repo).
      - key: EXPA_TOKEN
        sync: false
